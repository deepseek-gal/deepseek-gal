<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>突击竞技场 · 网页FPS</title>
<style>
  html,body{margin:0;height:100%;background:#dbe7f2;overflow:hidden;font-family:'Microsoft YaHei',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#a8c9e8;box-shadow:0 0 50px rgba(30,90,180,.22)}
  #ui{position:fixed;inset:0;pointer-events:none;color:#22303e}
  #cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
  #cross:before,#cross:after{content:'';position:absolute;background:rgba(25,60,95,.95)}
  #cross:before{left:8px;top:0;width:2px;height:18px}
  #cross:after{left:0;top:8px;width:18px;height:2px}
  #hud{position:fixed;left:20px;top:18px;font-size:20px;line-height:1.8;text-shadow:0 1px 2px rgba(255,255,255,.8)}
  #hud b{color:#0f6fc0}
  #buffs{position:fixed;left:20px;top:118px;font-size:18px;color:#0f6fc0;text-shadow:0 1px 2px rgba(255,255,255,.8)}
  #comboBanner{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-size:32px;font-weight:bold;color:#ff9d2e;text-shadow:0 2px 14px rgba(255,255,255,.95);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
  #hpbar{position:fixed;left:20px;bottom:22px;width:260px;height:16px;background:rgba(20,50,80,.15);border-radius:8px;overflow:hidden}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#4caf50,#8ff5a2);transition:width .15s}
  #flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,60,60,.35),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
  .ov{position:fixed;inset:0;background:rgba(244,249,253,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center;color:#22303e}
  .ov h1{font-size:52px;margin:0 0 8px;color:#0f6fc0;letter-spacing:6px;text-shadow:0 2px 12px rgba(15,111,192,.25)}
  .ov p{color:#4a5c6e;font-size:16px;line-height:2;margin:6px 0}
  .ov button{margin-top:26px;padding:14px 52px;font-size:20px;border:0;border-radius:30px;background:linear-gradient(135deg,#18a9e0,#0a4ea8);color:#fff;cursor:pointer}
  .ov button:hover{box-shadow:0 0 24px rgba(77,216,255,.6)}
  #dead h1{color:#ff6b81}
  .hidden{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="400"></canvas></div>
<div id="ui">
  <div id="cross"></div>
  <div id="hud">生命 <b id="hpT">100</b>　得分 <b id="scoreT">0</b>　波次 <b id="waveT">1</b>　剩余 <b id="leftT">0</b>　弹药 <b id="ammoT">30/30</b></div>
  <div id="buffs"></div>
  <div id="hpbar"><div id="hpfill"></div></div>
  <div id="comboBanner"></div>
  <div id="flash"></div>
</div>
<div class="ov" id="start">
  <h1>突击竞技场</h1>
  <p>W A S D 移动　鼠标瞄准　左键开火（按住连发）　R 换弹　Shift 冲刺<br>命中弱点一枪毙命，身体三枪<br>连续击杀可组词的偏旁（如火+暴=爆）触发增幅！</p>
  <p style="font-size:13px;color:#6a7c8e;margin-top:2px">合成表：火+暴=爆(爆炸)　日+月=明(射速)　氵+木=沐(回血)　女+子=好(加速)</p>
  <button id="startBtn">点击开始</button>
  <div style="margin-top:20px;color:#4a5c6e;font-size:16px">
    鼠标灵敏度 <span id="sensVal">1.0</span>x
    <br><input id="sens" type="range" min="0.2" max="3" step="0.1" value="1" style="width:280px;margin-top:8px">
  </div>
</div>
<div class="ov hidden" id="dead">
  <h1>阵亡</h1>
  <p id="deadInfo">得分 0　波次 1</p>
  <button id="againBtn">再来一局</button>
</div>
<div class="ov hidden" id="pause">
  <p>已暂停（按 Esc 后鼠标解锁）<br>点击画面恢复</p>
  <button id="resumeBtn">继续游戏</button>
</div>

const planeX = Math.cos(P.dir + Math.PI / 2) * TAN;
const planeY = Math.sin(P.dir + Math.PI / 2) * TAN;

// ---------- 输入 ----------
const keys = {};
let locked = false, mouseDown = false;
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousedown', e => { if (locked) mouseDown = true; });
window.addEventListener('mouseup', () => { mouseDown = false; });
document.addEventListener('mousemove', e => {
  if (!locked) return;
  P.dir += e.movementX * 0.0032 * sens;
  P.pitch = Math.max(-0.45, Math.min(0.45, P.pitch - e.movementY * 0.0022 * sens));
  updateCross();
});
function updateCross() {
  // 准星固定屏幕中心，上下瞄准由视角（pitch）完成
  document.getElementById('cross').style.transform = '';
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === cv;
  if (!locked && playing) $pause.classList.remove('hidden');
});
document.addEventListener('click', () => { if (!locked && playing) cv.requestPointerLock(); });

// ---------- 声音（WebAudio 合成） ----------
let AC = null;
function sfx(type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (type === 'shot') { o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); }
    else if (type === 'hit') { o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(220, t + 0.1); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1); }
    else if (type === 'head') { o.type = 'square'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(400, t + 0.12); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); }
    else if (type === 'hurt') { o.type = 'sawtooth'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.2); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); }
    else { o.type = 'triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.25); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); }
    o.start(t); o.stop(t + 0.3);
  } catch (e) {}
}

// ---------- 敌人 ----------
function spawnEnemy(r) {
  for (let i = 0; i < 300; i++) {
    const x = 1.5 + Math.random() * (MW - 3), y = 1.5 + Math.random() * (MH - 3);
    if (cell(x, y)) continue;
    if (cell(x + 0.25, y) || cell(x - 0.25, y) || cell(x, y + 0.25) || cell(x, y - 0.25)) continue;
    if (Math.hypot(x - P.x, y - P.y) < 4) continue;
    enemies.push({ x: x, y: y, px: x, py: y, hp: 100, r: r || RAD_KEYS[Math.floor(Math.random() * RAD_KEYS.length)], t: Math.random() * 6, stuckT: 0 });
    return;
  }
}
function startWave() {
  const n = Math.min(4 + wave * 3, 24);
  const pairCount = Math.max(1, Math.min(3, Math.floor(n / 4)));
  const used = [];
  for (let i = 0; i < pairCount; i++) {
    let c = COMBOS[Math.floor(Math.random() * COMBOS.length)];
    let guard = 0;
    while (used.indexOf(c) >= 0 && guard++ < 30) c = COMBOS[Math.floor(Math.random() * COMBOS.length)];
    used.push(c);
    spawnEnemy(c.pair[0]); spawnEnemy(c.pair[1]);
  }
  for (let i = enemies.length; i < n; i++) spawnEnemy();
  UI.wave.textContent = wave;
  updateLeft();
  if (used.length) {
    const hint = used.map(c => RADICALS[c.pair[0]].ch + '+' + RADICALS[c.pair[1]].ch + '=' + c.word).join('　');
    showBanner('本波可合成：' + hint);
  }
}
function updateLeft() { UI.left.textContent = enemies.length; }

// ---------- 游戏流程 ----------
let playing = false;
function startGame() {
  P = { x: 8.5, y: 13.5, dir: 0, pitch: 0, hp: 100 };
  score = 0; wave = 1; enemies = []; fireCd = 0; dmgCd = 0; muzzle = 0; nextWaveT = 0;
  ammo = 30; reloading = false; reloadT = 0; stamina = 100;
  boomT = 0; fastT = 0; speedT = 0; shieldT = 0;
  lastRadical = null; lastKillT = 0; killCombo = 0; comboT = 0;
  pickups = []; floaters = []; shake = 0;
  startWave();
  $start.classList.add('hidden'); $dead.classList.add('hidden'); $pause.classList.add('hidden');
  playing = true;
  cv.requestPointerLock();
  UI.hpfill.style.width = '100%';
  UI.hp.textContent = 100; UI.score.textContent = 0;
  updateAmmo(); refreshBuffs();
}
function die() {
  playing = false;
  $deadInfo.textContent = '得分 ' + score + '　波次 ' + wave;
  $dead.classList.remove('hidden');
  document.exitPointerLock && document.exitPointerLock();
  sfx('die');
}

// ---------- 更新 ----------
let lastT = 0;
function update(dt) {
  if (!playing) return;
  if (nextWaveT > 0) {
    nextWaveT -= dt;
    if (nextWaveT <= 0) { wave++; startWave(); sfx('wave'); }
  }
  if (boomT > 0) boomT -= dt;
  if (fastT > 0) fastT -= dt;
  if (speedT > 0) speedT -= dt;
  if (shieldT > 0) shieldT -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) killCombo = 0; }
  refreshBuffs();
  if (reloading) {
    reloadT -= dt;
    if (reloadT <= 0) { ammo = 30; reloading = false; sfx('reload'); }
    updateAmmo();
  }
  if (shake > 0) { shake *= 0.86; if (shake < 0.3) shake = 0; }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt; f.y -= 36 * dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  // 冲刺与移动
  let mx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0); // 横向（右为正）
  let my = (keys['w'] ? 1 : 0) - (keys['s'] ? 1 : 0); // 纵向（前为正）
  const dashing = keys['shift'] && stamina > 1 && (mx || my);
  if (dashing) stamina = Math.max(0, stamina - 46 * dt);
  else stamina = Math.min(100, stamina + 22 * dt);
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    const cos = Math.cos(P.dir), sin = Math.sin(P.dir);
    const vx = (cos * my - sin * mx) / len;
    const vy = (sin * my + cos * mx) / len;
    const sp = SPEED * (speedT > 0 ? 1.6 : 1) * (dashing ? 1.7 : 1);
    const nx = P.x + vx * sp * dt;
    const ny = P.y + vy * sp * dt;
    if (!cell(nx + 0.18 * Math.sign(vx), P.y) && !cell(nx - 0.18 * Math.sign(vx), P.y)) P.x = nx;
    if (!cell(P.x, ny + 0.18 * Math.sign(vy)) && !cell(P.x, ny - 0.18 * Math.sign(vy))) P.y = ny;
  }
  if (muzzle > 0) muzzle -= dt;
  if (fireCd > 0) fireCd -= dt;
  if (mouseDown && fireCd <= 0 && !reloading) {
    if (ammo <= 0) reload();
    else { fireCd = fastT > 0 ? 0.08 : 0.16; ammo--; updateAmmo(); shoot(); }
  }
  if (dmgCd > 0) dmgCd -= dt;
  // 拾取物
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.hypot(p.x - P.x, p.y - P.y) < 0.85) {
      if (p.type === 'ammo') { ammo = Math.min(30, ammo + 30); addFloater(W / 2, H / 2 - 60, '+弹药', '#3fa9ff'); sfx('pick'); }
      else if (p.type === 'heal') { P.hp = Math.min(100, P.hp + 20); addFloater(W / 2, H / 2 - 60, '+20生命', '#ff7f6a'); sfx('pick'); }
      else { shieldT = 5; addFloater(W / 2, H / 2 - 60, '护盾 5s', '#ffe14d'); sfx('pick'); }
      pickups.splice(i, 1);
    }
  }
  // 敌人 AI
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy);
    const spd = Math.min(0.42, 0.28 + wave * 0.02) * (RADICALS[e.r].spd || 1);
    if (d > 0.01) {
      let a = Math.atan2(dy, dx);
      if (RADICALS[e.r].zig) a += Math.sin(e.t * 2.4 + e.y * 0.7) * 0.65;
      const vx = Math.cos(a), vy = Math.sin(a);
      const sx = Math.sign(vx), sy = Math.sign(vy);
      let movedX = false, movedY = false;
      if (!cell(e.x + vx * spd * dt + 0.22 * sx, e.y) && !cell(e.x + vx * spd * dt - 0.22 * sx, e.y)) { e.x += vx * spd * dt; movedX = true; }
      if (!cell(e.x, e.y + vy * spd * dt + 0.22 * sy) && !cell(e.x, e.y + vy * spd * dt - 0.22 * sy)) { e.y += vy * spd * dt; movedY = true; }
      if (!movedX && !movedY) e.stuckT += dt; else e.stuckT = 0;
      if (e.stuckT > 0.8) { unstuck(e); e.stuckT = 0; }
    }
    if (d < 1.05 && dmgCd <= 0) {
      dmgCd = 0.8; hurt(8);
      if (!playing) return;
    }
  }
  UI.hp.textContent = Math.max(0, Math.round(P.hp));
  UI.hpfill.style.width = Math.max(0, P.hp) + '%';
}
function unstuck(e) {
  const cx = Math.floor(e.x), cy = Math.floor(e.y);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  let best = null, bd = 1e9;
  for (const d2 of dirs) {
    if (cell(cx + d2[0], cy + d2[1])) continue;
    const tx = cx + d2[0] + 0.5, ty = cy + d2[1] + 0.5;
    const dd = Math.hypot(tx - e.x, ty - e.y);
    if (dd < bd) { bd = dd; best = [tx, ty]; }
  }
  if (best) { e.x += (best[0] - e.x) * 0.5; e.y += (best[1] - e.y) * 0.5; }
}
function shoot() {
  sfx('shot'); muzzle = 0.08;
  const wallD = castDist(P.dir);
  const crossY = H / 2;
  const crossX = W / 2;
  let best = null, bestD = 1e9, isWeak = false;
  for (const e of enemies) {
    const tr = project(e.x, e.y);
    if (!tr || tr.depth <= 0 || tr.depth >= wallD) continue;
    if (tr.depth >= bestD) continue;
    const g = spriteGeo(e, tr);
    if (Math.abs(tr.sx - crossX) > g.ww * 0.55 || crossY < g.top || crossY > g.bot) continue;
    const w = weakRect(e.r, g, tr.sx);
    const wk = crossX >= w.x && crossX <= w.x + w.w && crossY >= w.y && crossY <= w.y + w.h;
    best = e; bestD = tr.depth; isWeak = wk;
  }
  if (best) {
    best.hp -= isWeak ? 100 : 34;
    sfx(isWeak ? 'head' : 'hit');
    if (boomT > 0) explode(best);
    if (best.hp <= 0) applyKill(best, isWeak);
  }
  UI.score.textContent = score;
}
function explode(e) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const o = enemies[i];
    if (o === e || Math.hypot(o.x - e.x, o.y - e.y) >= 1.6) continue;
    o.hp -= 34;
    if (o.hp <= 0) {
      enemies.splice(i, 1); score += 50; sfx('kill');
      addFloater(W / 2, H / 2 - 70, '爆炸 +50', '#ff8c33');
    }
  }
  updateLeft();
}
function applyKill(e, isWeak) {
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
  killCombo = Math.min(5, killCombo + 1); comboT = 2.5;
  const mult = Math.max(1, killCombo);
  score += (isWeak ? 150 : 100) * mult;
  sfx('kill'); shake = Math.max(shake, 4);
  addFloater(W / 2, H / 2 - 70, (isWeak ? '弱点击杀 +' : '击杀 +') + ((isWeak ? 150 : 100) * mult) + (mult > 1 ? ' x' + mult : ''), isWeak ? '#ffe14d' : '#ffffff');
  if (RADICALS[e.r].boom && Math.hypot(P.x - e.x, P.y - e.y) < 1.7) { hurt(18); }
  if (Math.random() < 0.55) {
    const t = Math.random();
    const type = t < 0.55 ? 'ammo' : t < 0.75 ? 'heal' : 'shield';
    pickups.push({ x: e.x, y: e.y, type: type, t: 0 });
  }
  updateLeft();
  tryCombo(e.r);
  if (enemies.length === 0) nextWaveT = 1.4;
  UI.score.textContent = score;
}
function tryCombo(r) {
  const now = Date.now();
  if (lastRadical && lastRadical !== r && now - lastKillT < 6000) {
    const c = COMBOS.find(o => o.pair.indexOf(lastRadical) >= 0 && o.pair.indexOf(r) >= 0);
    if (c) {
      activate(c.buff);
      showBanner(c.text);
      lastRadical = null;
    } else lastRadical = r;
  } else lastRadical = r;
  lastKillT = now;
}
function activate(buff) {
  if (buff === 'boom') boomT = 6;
  else if (buff === 'fast') fastT = 6;
  else if (buff === 'heal') P.hp = Math.min(100, P.hp + 25);
  else if (buff === 'speed') speedT = 5;
  refreshBuffs();
}
function showBanner(text) {
  const b = document.getElementById('comboBanner');
  b.textContent = text;
  b.style.opacity = 1;
  clearTimeout(b._t);
  b._t = setTimeout(() => { b.style.opacity = 0; }, 2200);
}
function refreshBuffs() {
  let t = '';
  if (killCombo > 1 && comboT > 0) t += '连击 x' + killCombo + ' ';
  if (boomT > 0) t += '爆炸 ' + boomT.toFixed(0) + 's ';
  if (fastT > 0) t += '射速 ' + fastT.toFixed(0) + 's ';
  if (speedT > 0) t += '加速 ' + speedT.toFixed(0) + 's ';
  if (shieldT > 0) t += '护盾 ' + shieldT.toFixed(0) + 's ';
  document.getElementById('buffs').textContent = t;
}
function reload() {
  if (reloading || ammo === 30) return;
  reloading = true; reloadT = 1.1; sfx('reload');
  updateAmmo();
}
function updateAmmo() {
  document.getElementById('ammoT').textContent = reloading ? '换弹中…' : ammo + '/30';
}
function hurt(n) {
  if (shieldT > 0) { shieldT = 0; addFloater(W / 2, H / 2 - 80, '护盾抵消', '#ffe14d'); sfx('hurt'); return; }
  P.hp -= n;
  UI.flash.style.opacity = 1; setTimeout(() => { UI.flash.style.opacity = 0; }, 180);
  killCombo = 0; comboT = 0;
  shake = Math.max(shake, 7);
  addFloater(W / 2, H / 2 - 80, '-' + n, '#ff6b6b');
  sfx('hurt');
  if (P.hp <= 0) { P.hp = 0; die(); }
}
function addFloater(x, y, text, color) {
  floaters.push({ x: x, y: y, text: text, life: 0.9, color: color });
}
function castDist(ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = Math.floor(P.x), my = Math.floor(P.y);
  const sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
  let ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let sideX = dx < 0 ? (P.x - mx) * ddx : (mx + 1 - P.x) * ddx;
  let sideY = dy < 0 ? (P.y - my) * ddy : (my + 1 - P.y) * ddy;
  for (let i = 0; i < 100; i++) {
    if (sideX < sideY) { sideX += ddx; mx += sx; } else { sideY += ddy; my += sy; }
    if (cell(mx, my)) return sideX < sideY ? sideX - ddx : sideY - ddy;
  }
  return 20;
}
function project(ex, ey) {
  const dx = ex - P.x, dy = ey - P.y;
  const cos = Math.cos(P.dir), sin = Math.sin(P.dir);
  const fwd = dx * cos + dy * sin;      // 前向分量 = 深度
  const right = -dx * sin + dy * cos;   // 横向分量
  if (fwd <= 0.1) return null;
  return { depth: fwd, sx: W / 2 + (W / 2) * (right / fwd) / TAN };
}

function spriteGeo(e, tr) {
  const hh = (H / tr.depth) * 0.9;
  const ww = hh * 0.72;
  const base = H / 2 + hh / 2 + P.pitch * H * 0.42;
  return { hh, ww, top: base - hh, bot: base };
}
function weakRect(r, g, sx) {
  const ww = g.ww, hh = g.hh, c = RADICALS[r].weak;
  let x, y, w, h;
  if (c === 'top') { x = sx - ww * 0.3; y = g.top; w = ww * 0.6; h = hh * 0.22; }
  else if (c === 'bottom') { x = sx - ww * 0.3; y = g.bot - hh * 0.22; w = ww * 0.6; h = hh * 0.22; }
  else if (c === 'left') { x = sx - ww * 0.5; y = g.top + hh * 0.3; w = ww * 0.3; h = hh * 0.4; }
  else if (c === 'right') { x = sx + ww * 0.2; y = g.top + hh * 0.3; w = ww * 0.3; h = hh * 0.4; }
  else { x = sx - ww * 0.22; y = g.top + hh * 0.34; w = ww * 0.44; h = hh * 0.3; }
  return { x: x, y: y, w: w, h: h };
}

// ---------- 渲染 ----------
let zbuf = new Array(W);
function render() {
  const cos = Math.cos(P.dir), sin = Math.sin(P.dir);
  if (shake > 0) { ctx.save(); ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); }
  // 天花板与地板
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#8ec9f7'); sky.addColorStop(0.55, '#d6ecff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H / 2 + P.pitch * H * 0.42);
  ctx.fillStyle = '#bccbd9'; ctx.fillRect(0, H / 2 + P.pitch * H * 0.42, W, H);
  // 墙体
  const wallColors = { 1: '#9db2c5', 2: '#aab8c8', 3: '#c3abb3' };
  for (let x = 0; x < W; x++) {
    const camX = 2 * x / W - 1;
    const dx = cos + -sin * TAN * camX, dy = sin + cos * TAN * camX;
    let mx = Math.floor(P.x), my = Math.floor(P.y);
    const sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
    const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
    let sideX = dx < 0 ? (P.x - mx) * ddx : (mx + 1 - P.x) * ddx;
    let sideY = dy < 0 ? (P.y - my) * ddy : (my + 1 - P.y) * ddy;
    let hit = 0, side = 0;
    for (let i = 0; i < 100; i++) {
      if (sideX < sideY) { sideX += ddx; mx += sx; side = 0; } else { sideY += ddy; my += sy; side = 1; }
      if (cell(mx, my)) { hit = 1; break; }
    }
    const perp = hit ? (side === 0 ? sideX - ddx : sideY - ddy) : 16;
    zbuf[x] = perp;
    const lh = Math.floor(H / perp);
    const top = H / 2 - lh / 2 + P.pitch * H * 0.42;
    const sh = Math.max(0.35, 1 - perp / 13);
    ctx.fillStyle = wallColors[hit ? 1 : 1];
    ctx.globalAlpha = side ? sh * 0.72 : sh;
    ctx.fillRect(x, top, 1, lh);
    ctx.globalAlpha = 1;
  }
  // 敌人（按距离从远到近）
  const list = [];
  for (const e of enemies) { const tr = project(e.x, e.y); if (tr) list.push({ e, tr }); }
  list.sort((a, b) => b.tr.depth - a.tr.depth);
  for (const o of list) {
    const { e, tr } = o;
    const rad = RADICALS[e.r];
    const g = spriteGeo(e, tr);
    const cx = tr.sx, cy = (g.top + g.bot) / 2;
    const idx = Math.max(0, Math.min(W - 1, Math.floor(cx)));
    if (tr.depth >= zbuf[idx]) continue;
    const r0 = g.ww / 2 * (1 + 0.05 * Math.sin(Date.now() * 0.004 + e.t * 3));
    const sh = Math.max(0.35, 1 - tr.depth / 12);
    const glow = ctx.createRadialGradient(cx, cy, r0 * 0.2, cx, cy, r0 * 1.8);
    glow.addColorStop(0, 'rgba(' + hexRgb(rad.glow) + ',' + (sh * 0.55) + ')');
    glow.addColorStop(1, 'rgba(' + hexRgb(rad.glow) + ',0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, r0 * 1.8, 0, Math.PI * 2); ctx.fill();
    const bg = ctx.createRadialGradient(cx - r0 * 0.35, cy - r0 * 0.35, r0 * 0.15, cx, cy, r0);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.4, rad.color);
    bg.addColorStop(1, 'rgba(' + hexRgb(rad.color) + ',0.75)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(cx, cy, r0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold ' + Math.round(g.hh * 0.44) + 'px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rad.ch, cx, cy + g.hh * 0.02);
    const w = weakRect(e.r, g, cx);
    const mx = w.x + w.w / 2, my = w.y + w.h / 2, mw = Math.min(w.w, w.h) / 2;
    ctx.fillStyle = 'rgba(255,225,77,0.95)';
    ctx.save(); ctx.translate(mx, my); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-mw * 0.7, -mw * 0.7, mw * 1.4, mw * 1.4);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,225,77,0.65)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    ctx.textBaseline = 'alphabetic';
  }
  // 拾取物
  for (const p of pickups) {
    const tr = project(p.x, p.y);
    if (!tr || tr.depth >= zbuf[Math.max(0, Math.min(W - 1, Math.floor(tr.sx)))]) continue;
    const sz = Math.max(8, 34 / tr.depth);
    const px = tr.sx, py = H / 2 + 40 / tr.depth + P.pitch * H * 0.42;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (p.type === 'ammo') { ctx.fillStyle = '#3fa9ff'; ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz); }
    else if (p.type === 'heal') { ctx.fillStyle = '#ff7f6a'; ctx.beginPath(); ctx.arc(px, py, sz / 2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(px, py, sz / 2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(sz) + 'px sans-serif';
    ctx.fillText(p.type === 'ammo' ? '弹' : p.type === 'heal' ? '血' : '盾', px, py);
    ctx.textBaseline = 'alphabetic';
  }
  // 浮动提示字
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life / 0.9);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  // 小地图
  const mms = 120 / MW, mmx = W - 4 - MW * mms, mmy = 8;
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fillRect(mmx - 4, mmy - 4, MW * mms + 8, MH * mms + 8);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (cell(x, y)) {
    ctx.fillStyle = '#4a5c6e'; ctx.fillRect(mmx + x * mms, mmy + y * mms, mms + 0.5, mms + 0.5);
  }
  for (const e of enemies) {
    ctx.fillStyle = RADICALS[e.r].color;
    ctx.beginPath(); ctx.arc(mmx + e.x * mms, mmy + e.y * mms, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(mmx + P.x * mms, mmy + P.y * mms, 3, 0, Math.PI * 2); ctx.fill();
  // 枪口火焰
  if (muzzle > 0) {
    ctx.fillStyle = 'rgba(255,220,90,0.85)';
    ctx.beginPath(); ctx.arc(W / 2, H / 2 + 24, 8 + Math.random() * 6, 0, Math.PI * 2); ctx.fill();
  }
  drawGun();
  if (shake > 0) ctx.restore();
}
function drawGun() {
  const t = Date.now() * 0.001;
  const recoil = muzzle > 0 ? -9 : 0;
  const sway = Math.sin(t * 2.2) * 2;
  ctx.save();
  if (gunImg.complete && gunImg.naturalWidth > 0) {
    ctx.translate(W / 2 + 10, H + 30 + recoil + sway);
    ctx.rotate(-0.28);
    ctx.drawImage(gunImg, -300, -140, 600, 600);
    ctx.restore();
    return;
  }
  ctx.translate(W / 2 + 38, H + 10 + recoil + sway);
  ctx.rotate(-0.16);
  // 枪管
  const barrel = ctx.createLinearGradient(0, 0, 0, -170);
  barrel.addColorStop(0, '#486180'); barrel.addColorStop(1, '#24344a');
  ctx.fillStyle = barrel;
  ctx.fillRect(-13, -168, 26, 170);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(-9, -166, 4, 160);
  // 枪口制退器
  ctx.fillStyle = '#1b2738';
  ctx.fillRect(-19, -188, 38, 26);
  ctx.fillStyle = '#39c5ff';
  ctx.fillRect(-19, -188, 38, 4);
  // 枪身
  const body = ctx.createLinearGradient(-40, 0, 40, 0);
  body.addColorStop(0, '#3a4f68'); body.addColorStop(0.5, '#5a769a'); body.addColorStop(1, '#2e4058');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(-44, -122); ctx.lineTo(40, -122); ctx.lineTo(36, -62); ctx.lineTo(-38, -62);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-42, -120); ctx.lineTo(38, -120); ctx.stroke();
  // 弹匣
  ctx.fillStyle = '#25334a';
  ctx.beginPath();
  ctx.moveTo(-34, -62); ctx.lineTo(30, -62); ctx.lineTo(18, -16); ctx.lineTo(-22, -16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(-30, -58, 8, 34);
  // 握把
  ctx.fillStyle = '#2b3a4c';
  ctx.beginPath();
  ctx.moveTo(8, -66); ctx.lineTo(40, -66); ctx.lineTo(16, -8); ctx.lineTo(-4, -8);
  ctx.closePath(); ctx.fill();
  // 能量核心
  const glow = ctx.createRadialGradient(34, -96, 2, 34, -96, 20);
  glow.addColorStop(0, 'rgba(210,246,255,0.95)');
  glow.addColorStop(0.45, '#39c5ff');
  glow.addColorStop(1, 'rgba(57,197,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(34, -96, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d7f6ff';
  ctx.beginPath(); ctx.arc(34, -96, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 主循环 ----------
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('resumeBtn').onclick = () => { $pause.classList.add('hidden'); cv.requestPointerLock(); };
const sensEl = document.getElementById('sens'), sensVal = document.getElementById('sensVal');
sensEl.value = sens; sensVal.textContent = sens.toFixed(1);
sensEl.oninput = () => {
  sens = parseFloat(sensEl.value);
  sensVal.textContent = sens.toFixed(1);
  try { localStorage.setItem('fps_sens', sens); } catch (e) {}
};
if (GUN_IMG) { gunImg.src = GUN_IMG; }
requestAnimationFrame(frame);
</script>
