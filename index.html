<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鲸的工作室 · 网页小游戏合集</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,#eaf4ff 0%,#d6e9ff 60%,#bfdcf7 100%);font-family:'Microsoft YaHei',sans-serif;color:#22303e;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:860px;width:100%;text-align:center}
  h1{font-size:38px;margin:0 0 6px;color:#0f6fc0;letter-spacing:4px}
  .sub{color:#5a7188;margin:0 0 30px}
  .cards{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
  .card{flex:1 1 300px;max-width:400px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(15,111,192,.16);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(15,111,192,.25)}
  .ico{font-size:52px;margin-bottom:8px}
  .card h2{margin:0 0 6px;font-size:24px}
  .card p{margin:0;font-size:14px;color:#5a7188;line-height:1.8}
  .tag{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:20px;font-size:13px;color:#fff;background:linear-gradient(135deg,#18a9e0,#0a4ea8)}
  footer{margin-top:28px;font-size:13px;color:#6f879e}
</style>
</head>
<body>
<div class="wrap">
  <h1>小鲸的工作室</h1>
  <p class="sub">两个网页小游戏，点击卡片直接开玩</p>
  <div class="cards">
    <a class="card" href="fps.html">
      <div class="ico">🔫</div>
      <h2>突击竞技场</h2>
      <p>浏览器 FPS：偏旁部首敌人、弱点一枪毙命、击杀组词触发增幅、连击/冲刺/小地图。需鼠标键盘。</p>
      <span class="tag">立即游玩</span>
    </a>
    <a class="card" href="deepblue-letter.html">
      <div class="ico">🐳</div>
      <h2>深蓝来信</h2>
      <p>DeepSeek 鲸灵少女的文字冒险：戒赌主题、双结局，点击推进剧情。</p>
      <span class="tag">立即游玩</span>
    </a>
  </div>
  <footer>离线可玩 · 单文件 · 无需安装</footer>
</div>
</body>
</html>
